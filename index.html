<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ブロック崩しメーカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="screen-title" class="screen title-screen">
      <div class="title-card">
        <p class="brand">MRS GAMES</p>
        <h1>ブロック崩し<br><span>メーカー</span></h1>
        <p class="tagline">こわして、クリアして、自分で作ろう！</p>
        <button id="btn-start" class="btn btn-primary btn-large" type="button">あそぶ</button>
        <button id="btn-make" class="btn btn-secondary" type="button">🧱 ステージをつくる</button>
        <button id="btn-settings" class="btn btn-secondary" type="button">⚙️ サウンド設定</button>
        <a class="mrs-link" href="https://mrs-games.pages.dev/" target="_blank" rel="noopener">MRS GAMESへ</a>
      </div>
    </section>

    <section id="screen-stages" class="screen hidden">
      <div class="panel stage-panel">
        <header class="panel-header">
          <button id="btn-stage-back" class="icon-button" type="button" aria-label="タイトルへ戻る">←</button>
          <div>
            <p class="eyebrow">PRESET STAGES</p>
            <h2>ステージをえらぶ</h2>
          </div>
        </header>
        <div id="stage-list" class="stage-list"></div>
      </div>
    </section>

    <section id="screen-maker" class="screen maker-screen hidden">
      <header class="maker-header">
        <button id="btn-maker-back" class="icon-button" type="button" aria-label="タイトルへ戻る">←</button>
        <div class="maker-title">
          <p class="eyebrow">STAGE MAKER</p>
          <h2 id="maker-stage-name">MY STAGE 0001</h2>
        </div>
        <button id="btn-maker-undo" class="maker-history-button" type="button" disabled aria-label="元に戻す">↶</button>
        <button id="btn-maker-redo" class="maker-history-button" type="button" disabled aria-label="やり直す">↷</button>
      </header>

      <div class="maker-workspace">
        <div class="maker-board-shell">
          <div id="maker-grid" class="maker-grid" aria-label="10列15行の編集盤面"></div>
        </div>
      </div>

      <div class="maker-controls">
        <div class="maker-control-heading">
          <strong>ブロック</strong>
          <span id="maker-count">0 / 100</span>
        </div>
        <div id="maker-palette" class="maker-palette" aria-label="ブロック種類"></div>
        <label id="maker-item-settings" class="maker-item-settings hidden">
          <span>ドロップするアイテム</span>
          <select id="maker-item-select">
            <option value="random">ランダム</option>
            <option value="paddle">パドル拡大</option>
            <option value="multiball">ボール追加</option>
            <option value="largeBall">ボール拡大</option>
            <option value="explosiveBall">爆発ボール</option>
            <option value="life">1UP</option>
          </select>
        </label>
        <p id="maker-status" class="maker-status" aria-live="polite"></p>
        <div class="maker-actions">
          <button id="btn-maker-clear" class="btn btn-secondary maker-action-button" type="button" disabled>全消去</button>
          <button id="btn-maker-test" class="btn btn-primary maker-action-button" type="button" disabled>▶ テストプレイ</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen game-screen hidden">
      <header class="game-header">
        <span id="game-stage-name" class="stage-name">STAGE 01</span>
        <span id="game-time" class="game-stat">00:00.00</span>
        <span id="game-lives" class="game-stat lives">♥ 3</span>
        <button id="btn-pause" class="icon-button" type="button" aria-label="ポーズ">Ⅱ</button>
      </header>
      <div id="smash-gauge" class="smash-gauge" role="progressbar" aria-label="スマッシュゲージ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="smash-gauge-fill" class="smash-gauge-fill"></span>
        <span id="smash-gauge-label" class="smash-gauge-label">SMASH 0%</span>
      </div>
      <div id="game-wrap" class="game-wrap">
        <canvas id="game-canvas" width="360" height="560" aria-label="ブロック崩しのプレイ盤面"></canvas>
        <div id="effect-bar" class="effect-bar" aria-live="polite"></div>
        <div id="launch-guide" class="launch-guide">タップで発射</div>
      </div>
    </section>

    <section id="screen-clear" class="screen result-screen hidden">
      <div class="result-card">
        <p class="result-icon">🎉</p>
        <p class="eyebrow">STAGE CLEAR</p>
        <h2 id="clear-stage-name">STAGE 01</h2>
        <p id="clear-time" class="result-time">00:00.00</p>
        <p id="best-message" class="best-message"></p>
        <button id="btn-clear-retry" class="btn btn-primary" type="button">もう一度遊ぶ</button>
        <button id="btn-clear-stages" class="btn btn-secondary preset-only" type="button">他のステージ</button>
        <button id="btn-clear-make" class="btn btn-secondary preset-only" type="button">自分で作る</button>
        <button id="btn-clear-editor" class="btn btn-secondary maker-test-only hidden" type="button">編集へ戻る</button>
      </div>
    </section>

    <section id="screen-gameover" class="screen result-screen hidden">
      <div class="result-card">
        <p class="result-icon">💥</p>
        <p class="eyebrow">GAME OVER</p>
        <h2>もう一度挑戦！</h2>
        <button id="btn-gameover-retry" class="btn btn-primary" type="button">リトライ</button>
        <button id="btn-gameover-stages" class="btn btn-secondary preset-only" type="button">他のステージへ</button>
        <button id="btn-gameover-editor" class="btn btn-secondary maker-test-only hidden" type="button">編集へ戻る</button>
      </div>
    </section>

    <div id="modal-pause" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="modal-card">
        <h2 id="pause-title">ポーズ中</h2>
        <button id="btn-resume" class="btn btn-primary" type="button">つづける</button>
        <button id="btn-restart" class="btn btn-secondary" type="button">最初から</button>
        <button id="btn-quit" class="btn btn-secondary preset-only" type="button">ステージ選択へ</button>
        <button id="btn-pause-editor" class="btn btn-secondary maker-test-only hidden" type="button">編集へ戻る</button>
      </div>
    </div>

    <div id="modal-settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-card">
        <h2 id="settings-title">サウンド設定</h2>
        <button id="toggle-bgm" class="setting-toggle" type="button"><span>BGM</span><strong>ON</strong></button>
        <button id="toggle-se" class="setting-toggle" type="button"><span>効果音</span><strong>ON</strong></button>
        <button id="btn-settings-close" class="btn btn-primary" type="button">とじる</button>
      </div>
    </div>
  </main>

  <footer class="ad-banner" aria-label="広告">
    <div class="ad-inner">
      <!-- admax -->
      <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
      <!-- admax -->
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
